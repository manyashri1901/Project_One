; PlatformIO build of the logging firmware (the Arduino IDE also works).
; STATUS: not yet built here; verify on your machine.
[platformio]
src_dir = firmware/irrigation_logging

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  bblanchon/ArduinoJson@^6.21.5
  knolleary/PubSubClient@^2.8
